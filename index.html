<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe World | Browse Recipes</title>
    <style>
        /* --- Reset & Variables (Tailwind Color Mapping) --- */
        :root {
            --bg-page: #09090b;       /* zinc-950 */
            --bg-card: #18181b;       /* zinc-900 */
            --bg-hover: #27272a;      /* zinc-800 */
            --border: #27272a;        /* zinc-800 */
            --text-main: #ffffff;     /* white */
            --text-muted: #a1a1aa;    /* zinc-400 */
            --primary: #ef4444;       /* Primary accent */

            /* Category Colors */
            --red-500: #ef4444;
            --yellow-500: #eab308;
            --green-500: #22c55e;
            --emerald-500: #10b981;
            --pink-500: #ec4899;
            --blue-500: #3b82f6;
            --orange-500: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 1.5rem;
            line-height: 1.5;
        }

        @media (min-width: 768px) {
            body { padding: 3rem; }
        }

        /* --- Layout --- */
        .container {
            max-width: 1280px; /* max-w-7xl */
            margin: 0 auto;
        }

        .space-y-8 > * + * {
            margin-top: 2rem;
        }

        /* --- Typography --- */
        h1 {
            font-size: 3rem; /* 5xl */
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        /* Animated Heading Styles */
        @keyframes waveFill {
            0% { background-position: 0% 100%; }
            50% { background-position: 0% 50%; }
            100% { background-position: 0% 100%; }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animated-heading {
            position: relative;
            -webkit-text-stroke: 2px var(--primary);
            -webkit-text-fill-color: transparent;
            background: linear-gradient(to top, var(--primary) 0%, transparent 0%);
            background-size: 100% 200%;
            background-position: 0% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: waveFill 3s ease-in-out infinite, fadeInUp 1s ease-out;
        }

        .animated-heading::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, var(--primary) 0%, transparent 0%);
            background-size: 100% 200%;
            background-position: 0% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-stroke: 0;
            -webkit-text-fill-color: var(--primary);
            animation: waveFill 3s ease-in-out infinite;
        }

        h2 {
            font-size: 1.25rem; /* xl */
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        p.description {
            color: var(--text-muted);
        }

        /* --- Components: Search Bar --- */
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }
        
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 1.25rem;
            height: 1.25rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem; /* Left padding for icon */
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 9999px; /* Pill shape */
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--text-muted);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }
        
        .search-input::placeholder {
            color: #52525b; /* zinc-600 */
        }

        /* --- Components: Card --- */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem; /* rounded-xl */
            overflow: hidden;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }
        
        .card:hover {
            background-color: var(--bg-hover);
        }

        .card-content {
            padding: 1.5rem;
            flex: 1;
        }

        /* --- Recipe Card Specifics (Large, used for carousel) --- */
        .recipe-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: var(--bg-hover);
        }
        
        .recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* --- Horizontal Scroll (Carousel) - NEW STYLES --- */
        .carousel-wrapper {
            position: relative;
            padding: 0; 
            overflow: hidden; 
            /* Fading Effekt: Blendet Items an den Rändern sanft aus */
            mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        /* Responsive Masking für kleine Bildschirme */
        @media (max-width: 640px) {
            .carousel-wrapper {
                mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
                -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            }
        }

        .carousel-track {
            display: flex;
            transition: transform 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translateX(0);
            width: fit-content;
        }
        
        .carousel-item {
            width: 300px;
            flex-shrink: 0;
            margin-right: 1.5rem; /* 24px gap */
            transition: all 0.5s ease-in-out;
            opacity: 0.4;
            transform: scale(0.85);
            /* Sorgt dafür, dass die Transformation von der Mitte aus geht */
            transform-origin: center center;
        }

        .carousel-item.center {
            opacity: 1;
            transform: scale(1);
            width: 330px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .carousel-item.center:hover {
            border-radius: 1rem;
        }
        
        /* --- Controls & Dots --- */
        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none; 
        }
        
        .carousel-control-btn {
            background: var(--text-main);
            border: 1px solid var(--border);
            color: var(--bg-card);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
            pointer-events: auto;

            /* Buttons weit an den Rand schieben */
            margin: 0 1rem;
            opacity: 0.9;
        }

        @media (min-width: 768px) {
            .carousel-control-btn {
                margin: 0 2rem; /* Etwas Puffer für Desktop */
            }
        }
        @media (min-width: 1024px) {
            .carousel-control-btn {
                margin: 0 5rem; /* Noch weiter an den Rand auf großen Desktops */
            }
        }


        .carousel-control-btn:hover {
            transform: scale(1.2);
        }
        
        .carousel-dots {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            gap: 0.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            width: 24px; /* Pill shape */
            border-radius: 9999px;
            background: var(--primary);
        }


        /* --- Grid Layouts --- */
        .grid-recipes {
            display: grid;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid-recipes { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1024px) {
            .grid-recipes { grid-template-columns: repeat(3, 1fr); }
        }

        .grid-categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .grid-categories { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1024px) {
            .grid-categories { grid-template-columns: repeat(6, 1fr); }
        }

        .grid-filters {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .grid-filters { grid-template-columns: repeat(3, 1fr); }
        }

        /* --- Components: Badge & Tags --- */
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            background-color: var(--bg-hover);
            color: #d4d4d8;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .badge:hover { background-color: #3f3f46; }

        .badge.active-tag {
            background-color: var(--primary);
            color: var(--text-main);
            border-color: var(--primary);
        }

        .cat-card.active-category {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .cat-card.active-category .cat-title,
        .cat-card.active-category .cat-count {
            color: var(--text-main);
        }

        .cat-card.active-category .cat-icon-wrapper svg {
            color: var(--text-main);
        }

        .show-more-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 0.5rem;
        }
        .show-more-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .hidden-mobile {
            display: none;
        }

        /* --- Small Recipe Card Specifics (Subtler Cards for Alle Rezepte) --- */
        .small-cards-grid {
            grid-template-columns: 1fr;
            gap: 0.5rem; /* Smaller vertical gap */
        }
        @media (min-width: 768px) {
            .small-cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1024px) {
            .small-cards-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .small-recipe-card {
            display: flex;
            flex-direction: row; /* Horizontal layout */
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-shadow: none; /* Make it subtler */
        }
        .small-recipe-card:hover {
            background-color: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .small-recipe-card .card-content {
            padding: 0;
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .small-recipe-card .recipe-title-group {
            flex-grow: 1;
            max-width: 60%;
        }

        .small-recipe-card .recipe-title-group h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .small-recipe-card .recipe-meta {
            margin-top: 0;
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        /* Hide image for small card */
        .small-recipe-card img {
            display: none;
        }


        /* --- Helpers --- */
        .cat-icon-wrapper {
            width: 3rem; height: 3rem; border-radius: 9999px;
            margin: 0 auto 0.75rem auto; display: flex;
            align-items: center; justify-content: center;
        }
        .text-center { text-align: center; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 0.5rem; min-height: 40px; }

        .filter-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.5rem; }
        
        /* Helper classes */
        .bg-red-500 { background-color: var(--red-500); }
        .bg-yellow-500 { background-color: var(--yellow-500); }
        .bg-green-500 { background-color: var(--green-500); }
        .bg-emerald-500 { background-color: var(--emerald-500); }
        .bg-pink-500 { background-color: var(--pink-500); }
        .bg-blue-500 { background-color: var(--blue-500); }
        .text-orange-500 { color: var(--orange-500); }
        .text-blue-500 { color: var(--blue-500); }
        .text-green-500 { color: var(--green-500); }
        .text-white { color: white; }

        /* Icons */
        .icon { width: 1.5rem; height: 1.5rem; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-sm { width: 1.25rem; height: 1.25rem; }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid var(--border);
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        /* Language Selection Modal */
        #language-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 400px;
            width: 95%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-checkbox {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .modal-checkbox input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .modal-description {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .language-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .lang-btn {
            background-color: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background-color: var(--primary);
            color: var(--text-main);
            border-color: var(--primary);
        }

        /* Error View Specific */
        #error-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
        }
        #error-view h2 {
            color: white;
            font-size: 10rem;
            margin: 0 0 1rem 0;
            font-weight: 700;
            text-shadow: 0 0 5px white, 0 0 10px white, 0 0 15px white;
            animation: bounce 2s infinite;
        }
        #error-view p {
            color: white;
            font-size: 1.2rem;
            margin: 0.5rem 0;
            opacity: 0.8;
        }

        /* New Button Style */
        .error-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            margin-top: 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            color: black;
            background: white;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .error-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Toolbar Styles */
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mb-6 { margin-bottom: 1.5rem; }

        .btn-group {
            display: flex;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .btn-group-item {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .btn-group-item.active {
            background-color: var(--primary);
            color: var(--text-main);
        }

        .btn-group-item:hover {
            background-color: var(--bg-hover);
        }

        .btn-group-item.active:hover {
            background-color: var(--primary);
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <div style="margin-top: 1rem; color: var(--text-main); font-size: 1.25rem; font-weight: 600;">Loading</div>
        </div>
    </div>

    <!-- Language Selection Modal -->
    <div id="language-modal" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-title">Choose Your Language</h2>
            <p class="modal-description">Select your preferred language to continue browsing recipes.</p>
            <div class="modal-checkbox">
                <input type="checkbox" id="save-cookie-checkbox" checked>
                <label for="save-cookie-checkbox">Save language preference for 14 days</label>
            </div>
        <div class="language-buttons">
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="de">🇦🇹 Deutsch</button>
        </div>
        </div>
    </div>

    <!-- VIEW: Error / Loading State -->
    <div id="status-view" style="display: none;">
        <!-- Error content will be set by JS -->
    </div>

    <div class="container space-y-8">

        <!-- Toolbar -->
        <div class="flex items-center justify-between mb-6">
            <div></div>
            <!-- Language Toggle -->
            <div class="btn-group">
                <button class="btn-group-item active" id="lang-en" onclick="selectLanguage('en')">EN</button>
                <button class="btn-group-item" id="lang-de" onclick="selectLanguage('de')">DE</button>
            </div>
        </div>

        <!-- Header (Only Title/Description, Search moved) -->
        <div style="margin-bottom: 3rem;">
            <div class="text-center" style="margin-bottom: 2rem;">
                <h1 id="page-title">Browse Recipes</h1>
                <p id="page-description" class="description">Discover recipes by categories, tags, and more</p>
            </div>
        </div>

        <!-- NEUESTE REZEPTE (Carousel mit Autoscroll) -->
        <section>
            <h2 id="latest-recipes-title">✨ Latest Recipes</h2>
            <div class="carousel-wrapper">
                <div id="newest-container" class="carousel-track">
                    <div style="padding: 2rem; color: var(--text-muted); min-width: 100%;">Loading...</div>
                </div>
                <!-- Manual Controls -->
                <div class="carousel-controls">
                    <button id="prev-btn" class="carousel-control-btn" aria-label="Previous Recipe">
                        <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button id="next-btn" class="carousel-control-btn" aria-label="Next Recipe">
                        <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
            <!-- Dots -->
            <div id="carousel-dots" class="carousel-dots"></div>
        </section>

        <!-- Categories Section -->
        <section>
            <h2 id="categories-title">Categories</h2>
            <div id="categories-container" class="grid-categories">
                <!-- Loaded via JS -->
            </div>
        </section>



        <!-- ALL RECIPES GRID (mit Suche und Tags) -->
        <section>
            <h2 id="all-recipes-title">📋 All Recipes</h2>
            
            <!-- Search -->
            <div class="search-container" style="max-width: none; margin: 0 0 1rem 0;">
                <svg class="icon search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="recipe-search" class="search-input" placeholder="Search recipes by title or code...">
            </div>
            
            <!-- Tags -->
            <div style="margin-bottom: 2rem;">
                <h3 style="font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Filter Tags:</h3>
                <div id="tags-container" class="tags-container">
                    <!-- Loaded via JS -->
                </div>
            </div>
            
            <div id="all-recipes-grid" class="grid-recipes small-cards-grid">
                <!-- Loaded via JS -->
            </div>
            <div id="no-results" class="text-center" style="display: none; padding: 2rem; color: var(--text-muted);">
                No recipes found
            </div>
        </section>

    </div>

    <script>


        let allRecipes = [];
        let currentTags = [];
        let carouselInterval;
        let currentScrollIndex = 0;
        let allTags = [];
        let showMoreTags = false;
        let numRealItems = 0;
        let currentCategory = '';
        let categoryMappings = {};
        // 300px (Card width) + 24px (1.5rem gap) -> Muss im JS hart codiert bleiben
        const CAROUSEL_ITEM_WIDTH = 300 + 24;



        // Funktion zur Weiterleitung
        function goToViewer(recipeId) {
            window.location.href = `viewer.html?id=${recipeId}`;
        }

        // Error handling functions
        function showError(errorCode, message, description) {
            const statusView = document.getElementById('status-view');
            statusView.innerHTML = `
                <div id="error-view">
                    <h2>${errorCode}</h2>
                    <p>${message}</p>
                    <p>${description}</p>
                    <a href="#" class="error-btn" onclick="retryLoad()">Try Again</a>
                </div>
            `;
            statusView.style.display = 'block';
            document.getElementById('loading-screen').style.display = 'none';
            document.querySelector('.container').style.display = 'none';
        }

        function hideError() {
            document.getElementById('status-view').style.display = 'none';
            document.querySelector('.container').style.display = 'block';
        }

        function retryLoad() {
            hideError();
            init();
        }

        async function init() {
            const startTime = Date.now();
            document.getElementById('loading-screen').style.display = 'flex';

            try {
                // Parallel fetch
                const [tagsRes, categoryRes, indexRes] = await Promise.all([
                    fetch('tags.json'),
                    fetch('categories.json'),
                    fetch('index.json')
                ]);

                let hasError = false;

                // 1. Tags Logic
                if (tagsRes.ok) {
                    const data = await tagsRes.json();
                    renderTags(data.tags || []);
                } else {
                    console.warn("Tags.json not found. Tags will be generated from index data.");
                    // Optional: show warning, but continue
                }

                // 2. Category Mappings Logic
                if (categoryRes.ok) {
                    const data = await categoryRes.json();
                    const categoriesArray = data.categories || [];
                    categoryMappings = categoriesArray.reduce((acc, cat) => {
                        acc[cat.id] = cat;
                        return acc;
                    }, {});
                    renderCategories();
                } else {
                    console.warn("Categories.json not found. Using empty category mappings.");
                    // Optional: show warning, but continue
                }

                // 3. Recipes Logic
                if (indexRes.ok) {
                    allRecipes = await indexRes.json();

                    // Sort by timestamp descending
                    allRecipes.sort((a, b) => new Date(b.metadata.timestamp) - new Date(a.metadata.timestamp));

                    renderNewest(allRecipes.slice(0, 5));
                    renderAllRecipes(allRecipes);
                    updateCategoryCounts();
                    startAutoplay();
                } else {
                    hasError = true;
                    showError("DATA_ERROR", "Recipes could not be loaded.", "The recipe data is not available. Please try again later.");
                    return;
                }

                if (!hasError) {
                    // Hide loading screen after minimum 0.5 seconds
                    const elapsed = Date.now() - startTime;
                    const remaining = Math.max(0, 500 - elapsed);
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                    }, remaining);
                }

            } catch (err) {
                console.error("Error loading data:", err);
                showError("NETWORK_ERROR", "Data could not be loaded.", "Please check your internet connection and try again.");
            }
        }

        // Helper to safely get localized strings (handles both Object and String formats)
        function getLocalizedValue(val, lang = document.documentElement.lang || 'en') {
            if (!val) return '';
            if (typeof val === 'string') return val;
            return val[lang] || val['en'] || Object.values(val)[0] || '';
        }

        /* --- Carousel Logic --- */
        
        function updateCarouselDisplay() {
            const container = document.getElementById('newest-container');
            const items = container.querySelectorAll('.carousel-item');
            const wrapper = container.closest('.carousel-wrapper');

            if (items.length === 0 || !wrapper) return;

            // --- KORREKTE ZENTRIERUNGSBERECHNUNG ---

            // 1. Berechne die Position des Zentrums des aktiven Items relativ zum Anfang des Tracks.
            const centerOffset = currentScrollIndex * CAROUSEL_ITEM_WIDTH;

            // 2. Halbe Breite des Wrappers (Viewport)
            const halfWrapperWidth = wrapper.offsetWidth / 2;

            // 3. Die Translation ist: (Hälfte der Wrapper-Breite) - (Offset des Item-Zentrums im Track)
            const translateX = halfWrapperWidth - (centerOffset + 150);

            container.style.transform = `translateX(${translateX}px)`;

            // Set active class (opacity/scale) based on real index
            const realIndex = currentScrollIndex % numRealItems;
            items.forEach((item, index) => {
                if (index % numRealItems === realIndex) {
                    item.classList.add('center');
                } else {
                    item.classList.remove('center');
                }
            });

            renderDots(numRealItems);
        }
        
        function nextSlide() {
            const maxIndex = numRealItems - 1;
            if (maxIndex < 0) return;

            currentScrollIndex = (currentScrollIndex + 1) % numRealItems;
            updateCarouselDisplay();
            startAutoplay();
        }

        function prevSlide() {
            const maxIndex = numRealItems - 1;
            if (maxIndex < 0) return;

            currentScrollIndex = (currentScrollIndex - 1 + numRealItems) % numRealItems;
            updateCarouselDisplay();
            startAutoplay();
        }

        function goToSlide(index) {
            const maxIndex = numRealItems - 1;
            if (index < 0 || index > maxIndex) return;

            currentScrollIndex = index;
            updateCarouselDisplay();
            startAutoplay();
        }

        function startAutoplay() {
            clearInterval(carouselInterval);
            const maxIndex = numRealItems - 1;

            if (numRealItems <= 1) return;

            carouselInterval = setInterval(() => {
                nextSlide();
            }, 4000);
        }

        function renderDots(count) {
            const dotsContainer = document.getElementById('carousel-dots');
            dotsContainer.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === currentScrollIndex % numRealItems) {
                    dot.classList.add('active');
                }
                dot.dataset.index = i;
                dot.onclick = () => goToSlide(i);
                dotsContainer.appendChild(dot);
            }
        }
        
        /* --- Card Creation --- */
        function createRecipeCard(recipe, style = 'large') {
            const title = getLocalizedValue(recipe.metadata.title);
            const desc = getLocalizedValue(recipe.metadata.description);
            // Tags können ein Array von Strings sein oder fehlen
            const tagsAttr = recipe.metadata.tags ? (Array.isArray(recipe.metadata.tags) ? recipe.metadata.tags.join(',') : '') : '';

            let dateStr = '';
            try {
                dateStr = new Date(recipe.metadata.timestamp).toLocaleDateString('en-GB');
            } catch(e) { dateStr = 'Unknown date'; }

            const time = recipe.metadata.time || 30; // Default to 30 if not set

            if (style === 'small') {
                // SMALL/SUBTLE CARD (for Alle Rezepte)
                return `
                    <div class="card small-recipe-card" data-tags="${tagsAttr}" onclick="goToViewer('${recipe.id}')">
                        <div class="card-content">
                            <div class="recipe-title-group">
                                <h3 style="color: var(--text-main);">${title}</h3>
                            </div>
                            <div class="recipe-meta">
                                <span>🕒 ${time} Min</span>
                                <span>📅 ${dateStr}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // LARGE/CAROUSEL CARD (for Neueste Rezepte)
            const classes = 'card carousel-item';
            const imgUrl = recipe.metadata.image || 'https://via.placeholder.com/400x300?text=Kein+Bild';

            return `
                <div class="${classes}" onclick="goToViewer('${recipe.id}')">
                    <img src="${imgUrl}" alt="${title}" class="recipe-card-image" loading="lazy">
                    <div class="card-content">
                        <h3 style="font-weight:600; font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main);">${title}</h3>
                        <p style="font-size: 0.9rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${desc}</p>
                        <div class="recipe-meta">
                            <span>🕒 ${time} Min</span>
                            <span>📅 ${dateStr}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderNewest(recipes) {
            const container = document.getElementById('newest-container');
            if(recipes.length === 0) {
                container.innerHTML = '<div style="padding:1rem;">No new recipes.</div>';
                document.getElementById('carousel-dots').innerHTML = '';
                return;
            }
            numRealItems = recipes.length;
            const duplicatedRecipes = [...recipes, ...recipes];
            container.innerHTML = duplicatedRecipes.map(r => createRecipeCard(r, 'large')).join('');

            // Adjust display after rendering
            currentScrollIndex = 0;
            updateCarouselDisplay();
        }

        /* --- Filtering Logic --- */

        function filterRecipes() {
            const query = document.getElementById('recipe-search').value.toLowerCase();

            const filtered = allRecipes.filter(r => {
                const title = getLocalizedValue(r.metadata.title).toLowerCase();

                // 1. Filter by search query (Titel or ID)
                const matchesQuery = title.includes(query) || r.id.toLowerCase().includes(query);

                // 2. Filter by active tags
                let matchesTag = true;
                if (currentTags.length > 0) {
                    const recipeTags = r.metadata.tags || [];
                    // Recipe matches if it has ALL of the selected tags (by id)
                    matchesTag = currentTags.every(selectedTag =>
                        recipeTags.includes(selectedTag)
                    );
                }

                // 3. Filter by active category
                let matchesCategory = true;
                if (currentCategory) {
                    const categoryTags = categoryMappings[currentCategory]?.tags || [];
                    const recipeTags = r.metadata.tags || [];
                    matchesCategory = categoryTags.some(catTag => recipeTags.includes(catTag));
                }

                return matchesQuery && matchesTag && matchesCategory;
            });

            renderAllRecipes(filtered);
        }

        function handleTagClick(event) {
            const tagId = event.target.dataset.id;
            const container = document.getElementById('tags-container');

            // Toggle the tag in currentTags array
            const tagIndex = currentTags.indexOf(tagId);
            if (tagIndex > -1) {
                // Remove tag if already selected
                currentTags.splice(tagIndex, 1);
                event.target.classList.remove('active-tag');
            } else {
                // Add tag if not selected
                currentTags.push(tagId);
                event.target.classList.add('active-tag');
            }

            filterRecipes(); // WICHTIG: Filterung nach Tag-Änderung auslösen
        }

        function handleCategoryClick(event) {
            const clickedCategoryId = event.currentTarget.dataset.categoryId;
            const container = document.querySelector('.grid-categories');

            // Deselect if already selected
            if (clickedCategoryId === currentCategory) {
                currentCategory = '';
                event.currentTarget.classList.remove('active-category');
                event.currentTarget.style.boxShadow = '';
            } else {
                // Select new category
                currentCategory = clickedCategoryId;

                // Deselect all others
                container.querySelectorAll('.cat-card').forEach(card => {
                    card.classList.remove('active-category');
                    card.style.boxShadow = '';
                });

                // Select current one
                event.currentTarget.classList.add('active-category');

                // Add glow effect based on category color
                const iconWrapper = event.currentTarget.querySelector('.cat-icon-wrapper');
                const bgClass = Array.from(iconWrapper.classList).find(cls => cls.startsWith('bg-'));
                let shadowColor = 'rgba(239, 68, 68, 0.5)'; // default red
                if (bgClass === 'bg-yellow-500') shadowColor = 'rgba(234, 179, 8, 0.5)';
                else if (bgClass === 'bg-green-500') shadowColor = 'rgba(34, 197, 94, 0.5)';
                else if (bgClass === 'bg-emerald-500') shadowColor = 'rgba(16, 185, 129, 0.5)';
                else if (bgClass === 'bg-pink-500') shadowColor = 'rgba(236, 72, 153, 0.5)';
                else if (bgClass === 'bg-blue-500') shadowColor = 'rgba(59, 130, 246, 0.5)';
                event.currentTarget.style.boxShadow = `0 0 10px ${shadowColor}`;
            }

            filterRecipes(); // Trigger filtering after category change
        }

        function updateCategoryCounts() {
            const categories = document.querySelectorAll('.cat-card');
            categories.forEach(card => {
                const categoryId = card.dataset.categoryId;
                const countElement = card.querySelector('.cat-count');
                const categoryTags = categoryMappings[categoryId]?.tags || [];

                let count = 0;
                allRecipes.forEach(recipe => {
                    const recipeTags = recipe.metadata.tags || [];
                    if (categoryTags.some(catTag => recipeTags.includes(catTag))) {
                        count++;
                    }
                });

                countElement.textContent = `${count} ${getLocalizedValue({en: 'Recipes', de: 'Rezepte'})}`;
            });
        }

        function renderTags(tags) {
            const container = document.getElementById('tags-container');
            allTags = tags || [];
            if (allTags.length === 0) return;

            const isMobile = window.innerWidth < 768;
            const visibleTags = isMobile && !showMoreTags ? allTags.slice(0, 4) : allTags;

            let html = visibleTags.map(tag =>
                `<span class="badge" data-id="${tag.id}" onclick="handleTagClick(event)">${getLocalizedValue(tag)}</span>`
            ).join('');

            if (isMobile && allTags.length > 4) {
                const buttonText = showMoreTags ? 'show less' : 'show more';
                html += `<button class="show-more-btn" onclick="toggleShowMoreTags()">${buttonText}</button>`;
            }

            container.innerHTML = html;
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const categoryIds = Object.keys(categoryMappings);

            if (categoryIds.length === 0) return;

            let html = categoryIds.map(categoryId => {
                const config = categoryMappings[categoryId];
                return `
                    <div class="card cat-card" data-category-id="${categoryId}" onclick="handleCategoryClick(event)">
                        <div class="card-content text-center">
                            <div class="cat-icon-wrapper ${config.color}">
                                <svg class="icon text-white" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                            </div>
                            <h3 class="cat-title">${getLocalizedValue(config.name)}</h3>
                            <p class="cat-count">0 Recipes</p>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function toggleShowMoreTags() {
            showMoreTags = !showMoreTags;
            renderTags(allTags);
        }

        function renderAllRecipes(recipes) {
            const container = document.getElementById('all-recipes-grid');
            const noRes = document.getElementById('no-results');

            if (recipes.length === 0) {
                container.style.display = 'none';
                noRes.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            noRes.style.display = 'none';
            // Use 'small' style for the main grid
            container.innerHTML = recipes.map(r => createRecipeCard(r, 'small')).join('');
        }

        // Language preference is stored in cookie or sessionStorage

        // Cookie helper functions
        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
        }

        function getCookie(name) {
            const nameEQ = name + '=';
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:01 GMT;path=/';
        }

        // Language selection logic
        function showLanguageModal() {
            document.getElementById('language-modal').style.display = 'flex';
        }

        function hideLanguageModal() {
            document.getElementById('language-modal').style.display = 'none';
        }

        function selectLanguage(lang) {
            const saveCookie = document.getElementById('save-cookie-checkbox').checked;
            localStorage.setItem('selectedLanguage', lang);
            if (saveCookie) {
                setCookie('selectedLanguage', lang, 14);
            } else {
                sessionStorage.setItem('selectedLanguage', lang);
            }
            document.documentElement.lang = lang;

            // Update toolbar button active state
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-de').classList.toggle('active', lang === 'de');

            hideLanguageModal();
            init();
        }

        // Search Listener
        document.addEventListener('DOMContentLoaded', () => {
            let savedLang = getCookie('selectedLanguage') || sessionStorage.getItem('selectedLanguage');
            if (savedLang) {
                document.documentElement.lang = savedLang;
                init();
            } else {
                showLanguageModal();
            }

            // Add listeners for language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.dataset.lang;
                    selectLanguage(lang);
                });
            });

            // Attach listener for combined search/filter
            document.getElementById('recipe-search').addEventListener('input', filterRecipes);

            // Attach listeners for manual carousel controls
            document.getElementById('prev-btn').onclick = prevSlide;
            document.getElementById('next-btn').onclick = nextSlide;

            // Ensure carousel updates if window size changes (important for centering)
            window.addEventListener('resize', updateCarouselDisplay);
        });
    </script>
</body>
